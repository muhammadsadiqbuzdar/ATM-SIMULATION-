<!DOCTYPE html>
<html>
<head>
  <title>ATM Simulation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e8eef5;
      text-align: center;
    }
    .atm {
      width: 340px;
      margin: 50px auto;
      padding: 25px;
      background-color: #2c3e50;
      border-radius: 10px;
      color: white;
    }
    input {
      width: 220px;
      height: 35px;
      font-size: 16px;
      text-align: center;
      margin-bottom: 12px;
    }
    button {
      height: 40px;
      padding: 0 25px;
      font-size: 16px;
      background-color: #f39c12;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #d68910;
    }
    #message {
      margin-top: 15px;
      min-height: 25px;
      font-size: 16px;
      color: #f9e79f;
    }
    #balance {
      font-size: 16px;
      color: #abebc6;
    }
  </style>
</head>
<body>

  <div class="atm">
    <h2>ATM Simulation</h2>

    <!-- login screen -->
    <div id="loginScreen">
      <p>Enter your 4 digit PIN</p>
      <input type="password" id="pin" maxlength="4"><br>
      <button onclick="login()">Login</button>
    </div>

    <!-- withdraw screen (hidden at start) -->
    <div id="withdrawScreen" style="display: none;">
      <p>Enter amount to withdraw (0 to quit)</p>
      <input type="number" id="amount"><br>
      <button onclick="withdraw()">Withdraw</button>
    </div>

    <p id="message"></p>
    <p id="balance"></p>
  </div>

  <script>
    var correctPin = "4321";
    var balance = 20000;
    var attempts = 0;

    var message = document.getElementById("message");
    var balanceText = document.getElementById("balance");

    // check the pin (only 3 attempts)
    function login() {
      var pin = document.getElementById("pin").value;

      if (pin == correctPin) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("withdrawScreen").style.display = "block";
        message.textContent = "Login successful!";
      } else {
        attempts = attempts + 1;

        if (attempts == 3) {
          document.getElementById("loginScreen").style.display = "none";
          message.textContent = "Card blocked! Too many wrong attempts.";
        } else {
          message.textContent = "Wrong PIN. Attempts left: " + (3 - attempts);
        }
      }
      document.getElementById("pin").value = "";
    }

    // withdraw money (0 to quit)
    function withdraw() {
      var amount = Number(document.getElementById("amount").value);
      document.getElementById("amount").value = "";
      balanceText.textContent = "";

      if (amount == 0) {
        document.getElementById("withdrawScreen").style.display = "none";
        message.textContent = "Thank you for using ATM. Bye!";
      } else if (amount < 0) {
        message.textContent = "Invalid amount! Amount cannot be negative.";
      } else if (amount % 500 != 0) {
        message.textContent = "Amount must be a multiple of 500.";
      } else if (amount > balance) {
        message.textContent = "Insufficient balance!";
      } else {
        balance = balance - amount;
        message.textContent = "Please take your cash.";
        balanceText.textContent = "Remaining balance: Rs. " + balance;

        if (balance == 0) {
          document.getElementById("withdrawScreen").style.display = "none";
          message.textContent = "Your balance is now zero. Bye!";
          balanceText.textContent = "Remaining balance: Rs. 0";
        }
      }
    }
  </script>

</body>
</html>
